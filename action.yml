name: pr-proof
description: Checks what a pull request or issue says (files, functions, options, issues, CVEs, "adds tests") against the repository. No AI.
author: zch6a
branding:
  icon: check-square
  color: blue
inputs:
  mode:
    description: '"comment" (one comment listing what could not be verified, edited on later runs) or "summary" (only the job summary: a dry run)'
    default: comment
  label:
    description: Label added while something is unverified and removed when everything checks out; empty for none
    default: needs-evidence
  ignore:
    description: 'Names not to check, one per line or separated by commas: functions of a dependency, options of another tool, generated paths; "*" matches any characters (h11.*, --cov*, vendor/*)'
    default: ""
  issue-names:
    description: In issues, also check the file, function and option names (off by default: in issues they are mostly the reporter's own project or proposals; references and advisories are always checked)
    default: "false"
  check-maintainers:
    description: Also check pull requests and issues by owners, members and collaborators
    default: "false"
  fail-on-unverified:
    description: Fail the job when something could not be verified
    default: "false"
  github-token:
    description: Token for the API (reading the pull request's files and issues; writing the comment and label)
    default: ${{ github.token }}
outputs:
  unverified:
    description: How many statements could not be verified
runs:
  using: node24
  main: src/action.js
